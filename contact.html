<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Contact | EthioMarket</title><link rel="stylesheet" href="style.css"></head><body><main class="container"><section class="panel"><a class="logo" href="index.html">Ethio<span>Market</span></a><h1>Contact our team</h1><p class="muted">Send us a message. When SMTP is configured, the message will arrive in the store owner's inbox.</p><div class="contact-methods"><p><b>Phone:</b> <a href="tel:+251900000000">Call our team</a> (replace with your business number)</p><p><b>SMS:</b> <a href="sms:+251900000000">Send an SMS</a></p><p><b>Email:</b> use the form below.</p></div><form id="contact-form" class="form-grid"><label>Your name<input class="field" name="name" required></label><label>Your email<input class="field" type="email" name="email" required></label><label>Subject<input class="field" name="subject"></label><label>Message<textarea class="field" name="message" rows="6" maxlength="5000" required></textarea></label><button class="btn">Send message</button></form><div id="message"></div></section></main><script src="js/app.js"></script><script src="js/contact.js"></script><script src="js/i18n.js"></script></body></html>
